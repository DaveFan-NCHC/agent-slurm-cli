image: node:22-bookworm-slim

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

typecheck:
  stage: test
  script:
    - npm run typecheck

lint:
  stage: test
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

integration:
  stage: test
  script:
    - npm run test:integration

package:
  stage: build
  needs:
    - integration
    - lint
    - typecheck
    - test
  script:
    - npm run build
    - test -x dist/cli.js
    - node dist/cli.js --version
    - mkdir -p package
    - npm pack --pack-destination package
  artifacts:
    name: "slurm-agent-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - dist/
      - package/*.tgz

deploy-pages:
  stage: deploy
  needs:
    - job: package
      artifacts: false
  variables:
    ARCHIFY_REPOSITORY_PROVIDER: gitlab
  before_script: []
  script:
    - npm run build:pages
    - test -s public/index.html
  pages: true
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: gitlab-pages
    url: '$CI_PAGES_URL'
