image: node:22-bookworm-slim

stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

typecheck:
  stage: test
  script:
    - npm run typecheck

test:
  stage: test
  script:
    - npm test

package:
  stage: build
  needs:
    - typecheck
    - test
  script:
    - npm run build
    - test -x dist/cli.js
    - node dist/cli.js --version
    - mkdir -p package
    - npm pack --pack-destination package
  artifacts:
    name: "slurm-agent-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - dist/
      - package/*.tgz

deploy-pages:
  stage: deploy
  needs:
    - job: package
      artifacts: false
  before_script: []
  script:
    - npm run build:pages
    - test -s public/index.html
  pages: true
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: gitlab-pages
    url: '$CI_PAGES_URL'
